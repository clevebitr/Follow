name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-qrencode
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-nsis

      - name: Resolve version
        run: echo "SEMVER=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFOLLOW_EXE_IN_SOURCE_DIR=OFF
          -DFOLLOW_VERSION=$SEMVER

      - name: Build
        run: cmake --build build

      - name: Build NSIS installer
        run: |
          cd build
          cpack -G NSIS

      - name: Build portable package
        run: |
          cmake --install build --prefix pkg/Follow
          cd pkg
          cmake -E tar cf "../Follow-${SEMVER}-win64-portable.zip" --format=zip Follow

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/Follow-*-win64.exe
            Follow-*-win64-portable.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libgdk-pixbuf-2.0-dev libepoxy-dev \
            libqrencode-dev libcurl4-openssl-dev libjson-glib-dev \
            libsqlite3-dev librsvg2-dev \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev

      - name: Resolve version
        run: echo "SEMVER=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFOLLOW_EXE_IN_SOURCE_DIR=OFF
          -DFOLLOW_VERSION=$SEMVER

      - name: Build
        run: cmake --build build

      - name: Build portable package
        run: |
          mkdir -p pkg/Follow
          cmake --install build --prefix "$PWD/pkg/Follow"
          printf '#!/bin/sh\nDIR=$(dirname "$(readlink -f "$0")")\ncd "$DIR" && exec ./main "$@"\n' > pkg/Follow/follow
          cat > pkg/Follow/install.sh <<'INSTALL'
          #!/bin/sh
          set -eu
          SRC=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          PREFIX=${PREFIX:-$HOME/.local}
          DEST=$PREFIX/share/follow
          mkdir -p "$DEST" "$PREFIX/bin"
          cp -a "$SRC/." "$DEST/"
          printf '#!/bin/sh\ncd "%s" && exec ./main "$@"\n' "$DEST" > "$PREFIX/bin/follow"
          chmod +x "$PREFIX/bin/follow"
          echo "Follow installed to $DEST"
          echo "Run: follow"
          INSTALL
          chmod +x pkg/Follow/follow pkg/Follow/install.sh
          tar -czf "Follow-${SEMVER}-linux-x86_64.tar.gz" -C pkg Follow

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Follow-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Follow ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 安装

            - **Windows**：运行 `Follow-*-win64.exe` 安装包；或解压 `Follow-*-win64-portable.zip` 后进入 `Follow` 目录运行 `main.exe`。
            - **Linux**：解压 `Follow-*-linux-x86_64.tar.gz`，确保已安装 GTK4 / FFmpeg 等运行库；执行 `cd Follow && ./install.sh` 安装到 `~/.local`，或直接运行 `./follow`。

            配置、快捷键与平台支持见 README。
          files: |
            artifacts/Follow-*-win64.exe
            artifacts/Follow-*-win64-portable.zip
            artifacts/Follow-*-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
