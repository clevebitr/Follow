[window]
width       = 1920
height      = 1080
fullscreen  = false
title       = Follow

[qrcode]
link   = https://live.bilibili.com/1840990819
#link  = https://github.com/clevebitr
#label = MY LINK

[note]
text = Follow

[playback]
# off / all / one
repeat=all
shuffle=false

[cache]
# 歌词 / 封面 / B 站元数据 / 收听统计的落地目录。
# 留空 = <用户缓存目录>/follow（Windows 上是 %LOCALAPPDATA%\Microsoft\Windows\INetCache\follow）
# 支持 ~ 和相对当前目录的路径
#dir = cache

[net]
# 网络请求默认值。ua 留空则用内置的浏览器 UA（B 站这类接口认它）
#user_agent      = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36
#timeout         = 15   ; 整次请求，秒
#connect_timeout = 5    ; 建连，秒
proxy           = http://127.0.0.1:7890   ; YouTube 必填（curl 和 FFmpeg 都会走它）

# The audio list be like this:
#[audio{number}]
#lrc_offset=0   (毫秒或秒都行：2500 / 2.5s / -7.5)
#lrc = netease:李荣浩 耳朵 OR qq:李荣浩 耳朵 OR netease:186016 (ID)
#link=src/assets/耳朵-李荣浩.mp3
#link=https://www.youtube.com/watch?v=YudHcBIxlYw   (YouTube 页面链接会自动解析出音频轨)
#link=https://www.bilibili.com/video/BV1GJ411x7h7  (bilibili 页面链接同样自动解析)
#title=耳朵
#artist=李荣浩
#pic=src/assets/耳朵.jpg
#page=https://www.bilibili.com/video/BV1GJ411x7h7
#platform=bilibili

