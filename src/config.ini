[window]
width       = 1920
height      = 1080
fullscreen  = false
title       = Follow

[qrcode]
link   = https://live.bilibili.com/1840990819
#link  = https://github.com/clevebitr
#label = MY LINK

[note]
text = Follow

[playback]
# off / all / one
repeat=all
shuffle=false

[visualizer]
# 音频粒子背景。画在模糊封面和压暗层之间，不会盖住文字。
#   off   = 关掉（只保留原来的模糊封面 + 漂移色团）
#   dust  = 缓慢上浮的尘埃 / 微光，最克制，适合一直开着
#   warp  = 从中心向外飞的星流，低频越强速度越快
#   flow  = 跟着流场漂移的粒子轨迹，最“音乐可视化”
effect = dust
# 粒子数量：20 - 400，默认 150
#particles = 150
# 音频灵敏度：0.2 - 4.0，默认 1.0；觉得不够跳就调到 1.4 左右
#gain = 1.0

[keys]
# 按键绑定。多个键用逗号分隔，off / none 表示解绑。
# 键名用 GDK 的名字：space / Left / Right / Up / Down / Tab / Escape /
# F1..F12 / bracketleft / bracketright / backslash / Page_Up / Page_Down ...
# 也接受 esc / enter / pgup / pgdn 这些别名，可以带 ctrl+ / alt+ / shift+ / super+。
# 没写的动作沿用内置默认值。
play_pause   = space
seek_back    = Left
seek_forward = Right
next         = n
prev         = p
restart      = r
stop         = s
repeat       = l
shuffle      = h
lyric_earlier = bracketleft
lyric_later   = bracketright
lyric_reset   = backslash
fullscreen    = f, F11
help          = F1
playlist      = Tab
back          = Escape
quit          = q

[ui]
# 动效总开关：false = 关闭页面滑入/滑出、封面淡入、磁贴弹出、背景主色过渡
animations = true

[cache]
# 歌词 / 封面 / B 站元数据 / 收听统计的落地目录。
# 留空 = <用户缓存目录>/follow（Windows 上是 %LOCALAPPDATA%\Microsoft\Windows\INetCache\follow）
# 支持 ~ 和相对当前目录的路径
#dir = cache
# B 站 / YouTube 页面解析结果的缓存时长（秒）；0 = 每次重新解析。默认 2700（45 分钟）
# 缓存的直链失效时会自动删掉缓存并重新解析一次
#resolve_ttl = 2700
# 封面缓存上限（MB），超出后按最近使用时间清理。默认 128
#cover_max_mb = 128
# 音频缓存（预留）：把完整音频落到 <cache>/follow/audio，减少重复联网
#audio = false
#audio_max_mb = 512

[net]
# 网络请求默认值。ua 留空则用内置的浏览器 UA（B 站这类接口认它）
#user_agent      = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36
#timeout         = 15   ; 整次请求，秒
#connect_timeout = 5    ; 建连，秒
#proxy           = http://127.0.0.1:7890

# The audio list be like this:
#[audio{number}]
#link       =
#lrc        =
#lrc_offset =
#title      =
#artist     =
#pic        =
#page       =
#platform   =


