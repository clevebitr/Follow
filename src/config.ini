# Follow 配置模板
# 个人配置建议放到同目录的 config.local.ini：存在时优先读取，
# 且不会进入版本库或发布包。

[window]
width       = 1280
height      = 720
fullscreen  = false
title       = Follow

[qrcode]
#link  = https://github.com/clevebitr
#label = MY LINK

[note]
text = Follow

[playback]
# off / all / one
repeat  = all
shuffle = false

[visualizer]
# off / dust / warp / flow
effect = dust
#particles = 150
#gain = 1.0

[keys]
# 多个键用逗号分隔；off / none 表示解绑。
# 键名使用 GDK 名称，支持 ctrl+ / alt+ / shift+ / super+ 修饰。
play_pause    = space
seek_back     = Left
seek_forward  = Right
next          = n
prev          = p
restart       = r
stop          = s
repeat        = l
shuffle       = h
lyric_earlier = bracketleft
lyric_later   = bracketright
lyric_reset   = backslash
fullscreen    = f, F11
help          = F1
details       = i
playlist      = Tab
back          = Escape
quit          = q
perf          = F12

[ui]
animations   = true
backdrop_fps = 30

[cache]
# 留空 = <用户缓存目录>/follow
#dir = cache
#resolve_ttl = 2700
#cover_max_mb = 128
#audio = false
#audio_max_mb = 512

[net]
#user_agent      =
#timeout         = 15
#connect_timeout = 5
#proxy           = http://127.0.0.1:7890

[metadata]
# 首次识别需要联网搜索候选；之后只读本地 SQLite。
#enabled = true
#cover = true
#db =
#user_agent = Follow/0.1.0 ( https://github.com/clevebitr/follow )

# 曲目示例：复制后修改编号（audio1、audio2 ...）。
#[audio1]
#link       = https://www.bilibili.com/video/BV1xx411c7mD
#title      = 示例曲名
#artist     = 示例艺人
#lrc        = netease:示例曲名 示例艺人
#lrc_offset = 0
#pic        = https://example.com/cover.jpg
#page       = https://www.bilibili.com/video/BV1xx411c7mD
#platform   = bilibili
#note       = 备注

# 本地曲目示例（路径相对程序工作目录）。
#[audio2]
#link  = src/assets/example.mp3
#title = Local Track
#artist = Artist
#pic   = src/assets/example.jpg
#lrc   = src/assets/example.lrc
